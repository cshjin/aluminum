[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aluminum"
version = "0.1.0"
description = "ALUM (An LLM Unified Mesh) — one-command aggregator over Argo, ALCF, AskSage and Ollama via llm-rosetta-gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ALUM contributors" }]
keywords = ["llm", "gateway", "argo", "alcf", "asksage", "ollama", "llm-rosetta"]
dependencies = [
  "click>=8.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "platformdirs>=4.12.4",
  "rich>=13.0",
  "inquirerpy>=0.3.4",
  "llm-rosetta[gateway]>=0.10",
]

[project.optional-dependencies]
# Upstream proxies are optional — aluminum works with whichever are installed.
argo = ["argo-proxy>=3.0"]
alcf = ["alcf-proxy>=0.3.2"]
asksage = ["asksage-proxy>=0.3.0"]
all = ["aluminum[argo,alcf,asksage]"]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.0"]
dev = ["pytest>=8.0", "ruff>=0.17.0"]
litellm = ["litellm[proxy]>=1.105.1,<2"]
otel = [
  "aluminum[litellm]",
  "opentelemetry-sdk>=1.33.1,<2",
  "opentelemetry-exporter-otlp>=1.33.1,<2",
]

[project.scripts]
aluminum = "aluminum.cli:main"

[project.urls]
Homepage = "https://github.com/cshjin/aluminum"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
