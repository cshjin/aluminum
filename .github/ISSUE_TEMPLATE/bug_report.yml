name: Bug report
description: Report a reproducible defect in ALUMINUM.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Before submitting, check whether the issue is covered by the documentation or an existing issue.
  - type: input
    id: version
    attributes:
      label: ALUMINUM version
      description: Run `aluminum version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, and relevant backend/proxy versions.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the commands and inputs needed to reproduce the problem.
      placeholder: "1. Run ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, tokens, certificates, and other sensitive data before posting.
      render: text
